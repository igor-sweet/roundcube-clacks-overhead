name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  syntax:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Syntax Check
        run: php -l clacks_overhead.php

  release:
    needs: syntax
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build release archives
        run: |
          mkdir -p clacks_overhead
          cp clacks_overhead.php composer.json LICENSE README.md CHANGELOG.md clacks_overhead.js clacks_overhead/
          cp -r skins clacks_overhead/
          zip -r clacks_overhead-${{ steps.version.outputs.VERSION }}.zip clacks_overhead/
          tar -czf clacks_overhead-${{ steps.version.outputs.VERSION }}.tar.gz clacks_overhead/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            clacks_overhead-${{ steps.version.outputs.VERSION }}.zip
            clacks_overhead-${{ steps.version.outputs.VERSION }}.tar.gz
          generate_release_notes: false
          body_path: CHANGELOG.md