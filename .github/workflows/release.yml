name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build ZIP with correct folder name
        run: |
          mkdir -p clacks_overhead
          cp clacks_overhead.php composer.json LICENSE README.md CHANGELOG.md clacks_overhead/
          zip -r clacks_overhead-${{ steps.version.outputs.VERSION }}.zip clacks_overhead/
          tar -czf clacks_overhead-${{ steps.version.outputs.VERSION }}.tar.gz clacks_overhead/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            clacks_overhead-${{ steps.version.outputs.VERSION }}.zip
            clacks_overhead-${{ steps.version.outputs.VERSION }}.tar.gz
          generate_release_notes: false
          body_path: CHANGELOG.md