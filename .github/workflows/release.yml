name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Reusable-workflow calls, not duplicated job definitions - each of
  # these files is also its own independently triggered workflow (see
  # their own `on:` blocks). `needs:` below can only reference job names
  # defined in *this* file, which is exactly what these three are.
  syntax:
    uses: ./.github/workflows/syntax.yml

  unit-tests:
    uses: ./.github/workflows/unit-tests.yml

  e2e:
    uses: ./.github/workflows/e2e.yml

  release:
    needs: [syntax, unit-tests, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build release archives
        run: ./scripts/build-release.sh "${{ steps.version.outputs.VERSION }}"

      - name: Build release notes
        run: |
          {
            echo "✅ All checks passed for this release - [view the test run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo
            ./scripts/extract-changelog-section.sh "${{ steps.version.outputs.VERSION }}"
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            clacks_overhead-${{ steps.version.outputs.VERSION }}.zip
            clacks_overhead-${{ steps.version.outputs.VERSION }}.tar.gz
          generate_release_notes: false
          body_path: release-notes.md
